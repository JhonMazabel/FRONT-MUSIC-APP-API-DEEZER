<div class="glass-card p-0 border-round-2xl shadow-6 hover:shadow-8 transition-all transition-duration-400 overflow-hidden h-full flex flex-column group border-1 border-white-alpha-10 hover:border-primary-400">
  <div class="relative overflow-hidden aspect-ratio-1-1 cursor-pointer" [routerLink]="['/playlists', playlist.id]">
    <div class="absolute inset-0 bg-gradient-to-b from-transparent to-black-alpha-60 z-1"></div>
    <div class="surface-800 flex align-items-center justify-content-center h-full transition-transform transition-duration-500 hover:scale-110">
      <i class="pi pi-music text-7xl text-white-alpha-40"></i>
    </div>
    <div class="absolute bottom-0 right-0 p-3 z-2">
      <p-button icon="pi pi-play" [rounded]="true" [routerLink]="['/playlists', playlist.id]" styleClass="w-3rem h-3rem shadow-8 transform translate-y-2 group-hover:translate-y-0 opacity-0 group-hover:opacity-100 transition-all"></p-button>
    </div>
  </div>
  
  <div class="p-4 flex-grow-1">
    <h3 class="m-0 text-xl font-bold text-white tracking-wide truncate cursor-pointer" [routerLink]="['/playlists', playlist.id]">{{ playlist.name }}</h3>
    <p class="text-400 mt-2 mb-4 line-height-3 text-sm h-3rem overflow-hidden">{{ playlist.description || 'Sin descripción' }}</p>
    
    <div class="flex justify-content-between align-items-center border-top-1 border-white-alpha-10 pt-3">
      <div class="flex align-items-center gap-2">
        <div class="w-2rem h-2rem border-circle bg-white-alpha-10 flex align-items-center justify-content-center">
          <i class="pi pi-list text-xs text-primary"></i>
        </div>
        <span class="text-xs font-semibold text-200 uppercase letter-spacing-1">{{ playlist.tracks.length }} canciones</span>
      </div>
      <div class="flex gap-1">
        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" (onClick)="onEdit.emit(playlist)" styleClass="text-white-alpha-60 hover:text-white"></p-button>
        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [text]="true" (onClick)="onDelete.emit(playlist.id)" styleClass="hover:bg-red-900"></p-button>
      </div>
    </div>
  </div>
</div>
