@if (currentTrack()) {
  <div class="player-wrapper fixed bottom-0 left-0 w-full p-4 z-5 animation-duration-500 fadeinup">
    <div class="player-container glass-player border-round-3xl shadow-8 p-3 flex align-items-center justify-content-between border-1 border-white-alpha-10">
      
      <div class="flex align-items-center gap-4 w-3 pl-2">
        <div class="relative group">
          <img [src]="currentTrack()?.albumArt" width="64" class="border-round-xl shadow-4 group-hover:rotate-12 transition-all transition-duration-300" />
          <div class="absolute inset-0 border-round-xl bg-primary-reverse opacity-0 group-hover:opacity-20 transition-opacity"></div>
        </div>
        <div class="overflow-hidden">
          <div class="white-space-nowrap font-bold text-lg text-white text-overflow-ellipsis">{{ currentTrack()?.title }}</div>
          <div class="text-400 text-sm font-medium tracking-wide uppercase">{{ currentTrack()?.artist }}</div>
        </div>
      </div>
      
      <div class="flex flex-column align-items-center gap-3 w-6">
        <div class="flex align-items-center gap-5">
           <p-button icon="pi pi-random" [text]="true" styleClass="text-white-alpha-40 hover:text-white transition-colors"></p-button>
           <p-button icon="pi pi-step-backward" [text]="true" styleClass="text-white hover:scale-110 transition-transform"></p-button>
           <p-button [icon]="isPlaying() ? 'pi pi-pause' : 'pi pi-play'" [rounded]="true" 
                     styleClass="play-btn w-3.5rem h-3.5rem shadow-6 hover:scale-105 transition-all" (onClick)="togglePlay()"></p-button>
           <p-button icon="pi pi-step-forward" [text]="true" styleClass="text-white hover:scale-110 transition-transform"></p-button>
           <p-button icon="pi pi-sync" [text]="true" styleClass="text-white-alpha-40 hover:text-white transition-colors"></p-button>
        </div>
        
        <div class="w-full flex align-items-center gap-3 px-6">
          <span class="text-xs font-mono text-400 w-2rem text-right">{{ formatTime(currentTime()) }}</span>
          <div class="flex-grow-1 progress-container surface-700 border-round-xl overflow-hidden cursor-pointer h-0.5rem relative group" (click)="onSeek($event)">
            <div class="bg-primary h-full transition-width relative z-2" [style.width.%]="(currentTime() / duration()) * 100">
               <div class="absolute right-0 top-50 transform -translate-y-50 w-1rem h-1rem bg-white border-circle shadow-4 opacity-0 group-hover:opacity-100 transition-opacity"></div>
            </div>
            <div class="absolute inset-0 bg-white-alpha-10 z-1"></div>
          </div>
          <span class="text-xs font-mono text-400 w-2rem">{{ formatTime(duration()) }}</span>
        </div>
      </div>

      <div class="flex align-items-center justify-content-end gap-4 w-3 pr-4">
        <i [className]="volume() === 0 ? 'pi pi-volume-off text-red-400' : 'pi pi-volume-up text-primary'" class="text-xl"></i>
        <div class="w-8rem volume-container surface-700 border-round-xl overflow-hidden cursor-pointer h-0.5rem relative group" (click)="onVolumeChange($event)">
           <div class="bg-white h-full relative z-2" [style.width.%]="volume() * 100">
              <div class="absolute right-0 top-50 transform -translate-y-50 w-0.8rem h-0.8rem bg-primary border-circle shadow-2 opacity-0 group-hover:opacity-100 transition-opacity"></div>
           </div>
           <div class="absolute inset-0 bg-white-alpha-10 z-1"></div>
        </div>
      </div>

    </div>
  </div>
}
