<nav class="flex align-items-center justify-content-between px-5 py-3 glass-nav shadow-4 sticky top-0 z-5 border-bottom-1 border-white-alpha-10">
  <div class="flex align-items-center gap-4">
    <div class="text-2xl font-bold text-white cursor-pointer hover:text-primary transition-colors transition-duration-300" routerLink="/playlists">
      <i class="pi pi-headphones mr-2 text-primary"></i>MusicJM
    </div>
    
    <div class="hidden md:flex align-items-center gap-2 ml-4">
      <p-button icon="pi pi-chevron-left" [rounded]="true" [text]="true" (onClick)="goBack()" styleClass="text-white-alpha-70 hover:text-white hover:bg-white-alpha-10"></p-button>
      <p-button icon="pi pi-chevron-right" [rounded]="true" [text]="true" (onClick)="goForward()" styleClass="text-white-alpha-70 hover:text-white hover:bg-white-alpha-10"></p-button>
    </div>
  </div>

  <div class="flex align-items-center gap-3">
    @if (user()) {
      <span class="font-medium">Hola, {{ user()?.name }}</span>
      <p-button label="Salir" icon="pi pi-power-off" severity="danger" [text]="true" (onClick)="logout()"></p-button>
    }
  </div>
</nav>
