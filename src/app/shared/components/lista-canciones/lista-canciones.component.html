<p-table [value]="tracks" styleClass="p-datatable-striped">
  <ng-template pTemplate="header">
    <tr>
      <th style="width: 3rem">#</th>
      <th>Título</th>
      <th>Artista</th>
      <th style="width: 8rem">Duración</th>
      <th style="width: 8rem"></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-track let-rowIndex="rowIndex">
    <tr class="cursor-pointer hover:surface-100 transition-colors transition-duration-150">
      <td>{{ rowIndex + 1 }}</td>
      <td>
        <div class="flex align-items-center gap-3">
          <img [src]="track.albumArt" width="40" class="border-round shadow-1" />
          <span class="font-bold">{{ track.title }}</span>
        </div>
      </td>
      <td>{{ track.artist }}</td>
      <td>{{ formatDuration(track.duration) }}</td>
      <td>
        <div class="flex gap-2">
          <p-button [icon]="currentTrackId === track.id && isPlaying ? 'pi pi-pause' : 'pi pi-play'" 
                    [rounded]="true" [text]="true" severity="success" (onClick)="onTogglePlay.emit(track)"></p-button>
          <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="onRemove.emit(track.id)"></p-button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
